services:
  api:
    image: styxflow-backend
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.dev 
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages 
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    command: yarn workspace api dev
  
  worker:
    image: styxflow-backend
    pull_policy: never
    depends_on:
      - api
    volumes:
      - ./apps/api:/app/apps/api 
      - ./packages:/app/packages   
    command: yarn workspace api dev:worker
    env_file:
      - ./apps/api/.env

  postgres_db:
    image: postgres:17-alpine3.22
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: styxflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:  
  redis_data:
